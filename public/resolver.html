<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivio - Resolver Desafio</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        
        :root {
            --color-dark-bg: #0D0D0E;
            --color-surface: #17171A;
            --color-primary: #AD1457;
            --color-accent: #D81B60;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--color-dark-bg);
            color: #FFFFFF;
            background-image: 
                radial-gradient(at 0% 0%, rgba(173, 20, 87, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(216, 27, 96, 0.08) 0px, transparent 50%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-card {
            background: rgba(23, 23, 26, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
        }

        .glow-button {
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
            transition: all 0.3s ease;
        }

        .glow-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(216, 27, 96, 0.5);
        }
    </style>
</head>
<body class="p-6">
    <div class="glass-card max-w-lg w-full p-10 text-center flex flex-col items-center">
        <!-- Ícone do Desafio -->
        <div class="w-20 h-20 rounded-2xl flex items-center justify-center mb-6" style="background: rgba(173, 20, 87, 0.1); border: 1px solid rgba(173, 20, 87, 0.25);">
            <svg class="w-10 h-10" style="color: var(--color-accent);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
            </svg>
        </div>

        <h1 class="text-3xl font-extrabold tracking-tight mb-3">Resolução de Desafio</h1>
        <p class="text-gray-400 text-sm mb-2" id="vaga-info">Carregando informações da vaga...</p>
        
        <div class="w-12 h-[2px] rounded-full my-4" style="background: linear-gradient(90deg, var(--color-primary), var(--color-accent));"></div>

        <p class="text-gray-300 leading-relaxed mb-8">
            Esta é a página para resolver o desafio técnico associado a esta vaga. Por enquanto, ela permanece em branco conforme planejado.
        </p>

        <!-- Ações -->
        <div class="flex gap-4 w-full">
            <button onclick="goBack()" class="flex-1 py-3 px-6 rounded-xl border border-white/10 hover:bg-white/5 transition font-semibold text-sm">
                Voltar
            </button>
            <button onclick="alert('Área de resolução em desenvolvimento!')" class="glow-button flex-1 py-3 px-6 rounded-xl font-bold text-sm text-white">
                Iniciar
            </button>
        </div>
    </div>

    <script>
        // Carrega o título da vaga se vier por parâmetro
        const urlParams = new URLSearchParams(window.location.search);
        const vagaId = urlParams.get('vaga_id');
        
        if (vagaId) {
            fetch(`/api/v1/vagas`)
                .then(res => res.json())
                .then(vagas => {
                    const vaga = vagas.find(v => v.id == vagaId);
                    if (vaga) {
                        document.getElementById('vaga-info').innerText = `Vaga: ${vaga.titulo}`;
                    } else {
                        document.getElementById('vaga-info').innerText = `Vaga ID: ${vagaId}`;
                    }
                })
                .catch(() => {
                    document.getElementById('vaga-info').innerText = `Vaga ID: ${vagaId}`;
                });
        } else {
            document.getElementById('vaga-info').innerText = 'Nenhuma vaga especificada';
        }

        function goBack() {
            window.location.href = '/frontend/tela-principal/index.html';
        }
    </script>
</body>
</html>
